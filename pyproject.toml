[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multtable"
version = "0.1.0"
description = "乘法口诀表：可打印口诀表、填空练习纸与口诀查询"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "math", "multiplication", "times-table", "worksheet", "printable", "svg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
multtable = "multtable.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/multtable"
Source = "https://github.com/eastyou/multtable"

[tool.setuptools]
packages = ["multtable"]
